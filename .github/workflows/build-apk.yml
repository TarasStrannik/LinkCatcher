name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradlew and build
      run: |
        # Исправляем переносы строк, если они сбились, и даем права на запуск
        if [ -f gradlew ]; then
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
        else
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
        fi
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
