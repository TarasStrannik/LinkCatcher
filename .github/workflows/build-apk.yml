name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Debug and Build
      run: |
        echo "--- ПРОВЕРКА СТРУКТУРЫ ФАЙЛОВ ---"
        ls -la
        ls -la app/src/main/ || echo "ОШИБКА: Папка app/src/main/ не найдена!"
        
        if [ -f gradlew ]; then
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
        else
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
        fi
        
        echo "--- ЗАПУСК СБОРКИ С ПОДРОБНЫМИ ОШИБКАМИ ---"
        ./gradlew assembleDebug --stacktrace
